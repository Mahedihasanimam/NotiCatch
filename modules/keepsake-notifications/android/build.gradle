plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.keepsake'
version = '1.0.0'

android {
  namespace "expo.modules.keepsake"
  defaultConfig {
    versionCode 1
    versionName "1.0.0"
    consumerProguardFiles 'consumer-rules.pro'
  }
  lintOptions {
    abortOnError false
  }
}

dependencies {
  // Google Play In-App Updates (PlayUpdates.kt)
  implementation 'com.google.android.play:app-update:2.1.0'
  testImplementation 'junit:junit:4.13.2'
}
